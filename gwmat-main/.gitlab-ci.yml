image: node:16-slim

stages:
    - deploy

pages:
    stage: deploy
    script:
        - mkdir -p public/
        - cp -r ./documentation/docs/_build/html/* public/.

    artifacts:
        paths:
            - public
    rules:
        - if: $CI_COMMIT_BRANCH == 'main'
    environment:
        name: production/${CI_PROJECT_NAME}/${CI_COMMIT_REF_NAME}
        url: https://anuj.mishra.docs.ligo.org/${CI_PROJECT_NAME}
